name: Build & Publish Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Standalone Windows Package
    runs-on: windows-latest

    env:
      QT_QPA_PLATFORM: "offscreen"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download Pretrained Models
        run: |
          python scripts/download_models.py

      - name: Run Unit Tests
        run: |
          pytest -v

      - name: Build Standalone Bundle
        run: |
          pyinstaller --clean --noconfirm WhoIsInThePhoto.spec

      - name: Package Release Zip
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Copy-Item -Path "sample_data" -Destination "dist/WhoIsInThePhoto/sample_data" -Recurse -Force
          Compress-Archive -Path "dist/WhoIsInThePhoto" -DestinationPath "dist/WhoIsInThePhoto-win64.zip" -Force

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: "Who Is in the Photo? ${{ github.event.inputs.tag || github.ref_name }}"
          generate_release_notes: true
          files: |
            dist/WhoIsInThePhoto-win64.zip
