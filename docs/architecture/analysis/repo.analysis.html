3,364,365,366,367,368,369,370,371,372,373,374,375,376,377,378,379,380,381,382,383,384,385,386,387,388,389,390,391,392,393,394,395,396,397,398,399,400,401,402,403,404,405,406,407,408,409,410,411,412,413,414,415,416,417,418,419,420,421,422,423,424,425,426,427,428,429,430,431,432,433,434,435,436,437,438,439,440,441,442,443,444,445,446,447,448,449,450,451,452],"modified":[],"deleted":[]}},"app/__init__.py":{"total":4,"lines":["\"\"\"","App package for Who Is in the Photo desktop application.","Contains UI components, recognition engine, and utility modules.","\"\"\""],"changes":{"status":"unchanged","added":[],"modified":[],"deleted":[]}},"app/employee_loader.py":{"total":288,"lines":["\"\"\"","Employee Reference Directory Loader & Face Encoder.","","This module scans a designated folder of employee reference portraits, extracts","identities from filenames, validates that each portrait contains exactly one face,","and computes SFace 128-dimensional biometric embeddings for offline matching.","\"\"\"","","from dataclasses import dataclass, field","import os","from pathlib import Path","from typing import Callable, List, Optional, Tuple","import cv2","import numpy as np","","","@dataclass","class EmployeeRecord:","    \"\"\"Represents a validated employee reference profile.\"\"\"","    name: str","    file_path: str","    embedding: np.ndarray  # 128-dim normalized SFace feature vector","    bounding_box: Tuple[int, int, int, int]  # (x, y, w, h)","    landmarks: np.ndarray  # (5, 2) facial key points","","","@dataclass","class LoaderReport:","    \"\"\"Summary report detailing loaded employees and skipped/invalid files.\"\"\"","    total_images_found: int = 0","    valid_records: List[EmployeeRecord] = field(default_factory=list)","    skipped_no_face: List[Tuple[str, str]] = field(default_factory=list)      # (path, reason)","    skipped_multi_face: List[Tuple[str, str, int]] = field(default_factory=list)  # (path, reason, count)","    skipped_invalid_file: List[Tuple[str, str]] = field(default_factory=list) # (path, reason)","","    @property","    def valid_count(self) -> int:","        return len(self.valid_records)","","    @property","    def has_warnings(self) -> bool:","        return bool(self.skipped_no_face or self.skipped_multi_face or self.skipped_invalid_file)","","    def summary(self) -> str:","        lines = [","            \"=\" * 60,","            \"EMPLOYEE REFERENCE FOLDER LOAD SUMMARY\",","            \"=\" * 60,","            f\"Total image files found:       {self.total_images_found}\",","            f\"Successfully indexed profiles: {self.valid_count}\",","            f\"Skipped (No face detected):    {len(self.skipped_no_face)}\",","            f\"Skipped (Multiple faces):      {len(self.skipped_multi_face)}\",","            f\"Skipped (Corrupt/Unreadable):  {len(self.skipped_invalid_file)}\",","            \"=\" * 60,","        ]","        if self.skipped_no_face:","            lines.append(\"\\n[Warning: No Face Detected]\")","            for p, r in self.skipped_no_face:","                lines.append(f\"  - {Path(p).name}: {r}\")","        if self.skipped_multi_face:","            lines.append(\"\\n[Warning: Multiple Faces Detected (ambiguous identity)]\")","            for p, r, count in self.skipped_multi_face:","                lines.append(f\"  - {Path(p).name}: found {count} faces\")","        if self.skipped_invalid_file:","            lines.append(\"\\n[Warning: Unreadable or Corrupt Images]\")","            for p, r in self.skipped_invalid_file:","                lines.append(f\"  - {Path(p).name}: {r}\")","        return \"\\n\".join(lines)","","","class EmployeeLoader:","    \"\"\"","    Scans, detects, validates, and encodes reference portraits from a directory.","    Uses YuNet for face detection & landmarks, and SFace for 128-D embedding extraction.","    \"\"\"","","    SUPPORTED_EXTENSIONS = {\".jpg\", \".jpeg\", \".png\"}","","    def __init__(","        self,","        yunet_model_path: Optional[str] = None,","        sface_model_path: Optional[str] = None,","        score_threshold: float = 0.6,","        nms_threshold: float = 0.3,","    ):","        # Resolve default model paths relative to project root if not explicitly provided","        project_root = Path(__file__).resolve().parent.parent","        self.yunet_path = yunet_model_path or str(project_root / \"models\" / \"face_detection_yunet_2023mar.onnx\")","        self.sface_path = sface_model_path or str(project_root / \"models\" / \"face_recognition_sface_2021dec.onnx\")","","        if not os.path.exists(self.yunet_path):","            raise FileNotFoundError(f\"YuNet model not found at: {self.yunet_path}\")","        if not os.path.exists(self.sface_path):","            raise FileNotFoundError(f\"SFace model not found at: {self.sface_path}\")","","        self.score_threshold = score_threshold","        self.nms_threshold = nms_threshold","","        # Initialize detector with default dummy size; dynamic input size set per image","        self.detector = cv2.FaceDetectorYN.create(","            model=self.yunet_path,","            config=\"\",","            input_size=(320, 320),","            score_threshold=self.score_threshold,","            nms_threshold=self.nms_threshold,","            top_k=5000,","        )","","        # Initialize SFace recognizer","        self.recognizer = cv2.FaceRecognizerSF.create(","            model=self.sface_path,","            config=\"\",","        )","","    @staticmethod","    def extract_name_from_filename(filename: str) -> str:","        \"\"\"","        Extracts clean person name from image filename.","        Example: 'Priya Sharma.jpg' -> 'Priya Sharma'","        \"\"\"","        stem = Path(filename).stem","        # Clean up any duplicate spaces or underscores","        cleaned = stem.replace(\"_\", \" \").strip()","        return cleaned","","    @staticmethod","    def read_image_unicode(file_path: str) -> Optional[np.ndarray]:","        \"\"\"","        Robustly reads an image file supporting Unicode and Windows paths.","        Standard cv2.imread fails on Windows with non-ASCII characters;","        np.fromfile + cv2.imdecode works universally.","        \"\"\"","        try:","            with open(file_path, \"rb\") as f:","                bytes_array = bytearray(f.read())","            np_arr = np.asarray(bytes_array, dtype=np.uint8)","            img = cv2.imdecode(np_arr, cv2.IMREAD_COLOR)","            return img","        except Exception:","            return None","","    def process_single_image(self, file_path: str) -> Tuple[Optional[EmployeeRecord], Optional[str], Optional[int]]:","        \"\"\"","        Loads, detects faces, and extracts biometric embedding from a single reference photo.","","        Returns:","            (record, error_message, face_count)","            If successful, error_message is None.","        \"\"\"","        img = self.read_image_unicode(file_path)","        if img is None or img.size == 0:","            return None, \"File is corrupted or not a valid image format\", -1","","        h, w = img.shape[:2]","        if h \u003c 20 or w \u003c 20:","            return None, f\"Image dimensions too small ({w}x{h})\", -1","","        # Set dynamic input size for YuNet","        self.detector.setInputSize((w, h))","        _, faces = self.detector.detect(img)","","        face_count = 0 if faces is None else len(faces)","","        if face_count == 0:","            return None, \"No face detected in reference photo\", 0","","        if face_count > 1:","            return None, f\"Ambiguous reference: found {face_count} faces (expected exactly 1)\", face_count","","        # Exactly 1 face found: extract bounding box and 5 facial landmarks","        primary_face = faces[0]","        box = (int(primary_face[0]), int(primary_face[1]), int(primary_face[2]), int(primary_face[3]))","        landmarks = primary_face[4:14].reshape((5, 2))","","        # Align and crop face using SFace recognizer","        aligned_face = self.recognizer.alignCrop(img, primary_face)","","        # Extract 128-D biometric feature vector","        feature = self.recognizer.feature(aligned_face)","","        # L2 Normalize feature embedding vector","        norm = np.linalg.norm(feature)","        if norm > 0:","            feature = feature / norm","","        person_name = self.extract_name_from_filename(file_path)","","        record = EmployeeRecord(","            name=person_name,","            file_path=os.path.abspath(file_path),","            embedding=feature.flatten(),","            bounding_box=box,","            landmarks=landmarks,","        )","","        return record, None, 1","","    def load_from_folder(","        self,","        folder_path: str,","        progress_callback: Optional[Callable[[int, int, str], None]] = None,","    ) -> LoaderReport:","        \"\"\"","        Scans folder_path, processes all supported images, validates single-face criteria,","        and returns a comprehensive LoaderReport.","","        Args:","            folder_path: Directory path containing employee photos.","            progress_callback: Optional callback receiving (current_index, total_count, current_filename).","        \"\"\"","        folder = Path(folder_path)","        report = LoaderReport()","","        if not folder.exists() or not folder.is_dir():","            raise NotADirectoryError(f\"Provided path is not a valid directory: {folder_path}\")","","        # Collect all image files matching supported extensions","        image_files = [","            p for p in folder.iterdir()","            if p.is_file() and p.suffix.lower() in self.SUPPORTED_EXTENSIONS","        ]","","        # Sort for deterministic processing order","        image_files.sort(key=lambda p: p.name.lower())","        report.total_images_found = len(image_files)","","        for idx, img_path in enumerate(image_files, start=1):","            str_path = str(img_path)","            if progress_callback:","                progress_callback(idx, report.total_images_found, img_path.name)","","            record, err, face_count = self.process_single_image(str_path)","","            if record is not None:","                report.valid_records.append(record)","            else:","                if face_count == 0:","                    report.skipped_no_face.append((str_path, err or \"No face\"))","                elif face_count > 1:","                    report.skipped_multi_face.append((str_path, err or \"Multiple faces\", face_count))","                else:","                    report.skipped_invalid_file.append((str_path, err or \"Corrupt file\"))","","        return report","","","def select_folder_interactively() -> Optional[str]:","    \"\"\"Helper to open a native desktop folder selection dialog.\"\"\"","    try:","        from PySide6.QtWidgets import QApplication, QFileDialog","        app = QApplication.instance() or QApplication([])","        selected_dir = QFileDialog.getExistingDirectory(","            None,","            \"Select Employee Reference Photos Folder\",","            os.getcwd(),","        )","        return selected_dir if selected_dir else None","    except ImportError:","        # Fallback to tkinter if PySide6 isn't initialized","        import tkinter as tk","        from tkinter import filedialog","        root = tk.Tk()","        root.withdraw()","        return filedialog.askdirectory(title=\"Select Employee Reference Photos Folder\")","","","if __name__ == \"__main__\":","    import sys","","    print(\"=== Employee Reference Folder Loader ===\")","    target_dir = sys.argv[1] if len(sys.argv) > 1 else None","","    if not target_dir:","        print(\"No folder path supplied via argument. Opening folder dialog...\")","        target_dir = select_folder_interactively()","","    if not target_dir:","        print(\"Folder selection cancelled.\")","        sys.exit(0)","","    print(f\"Scanning directory: {target_dir}\")","    loader = EmployeeLoader()","","    def on_progress(current, total, filename):","        print(f\"[{current}/{total}] Processing: {filename}\")","","    report = loader.load_from_folder(target_dir, progress_callback=on_progress)","    print(\"\\n\" + report.summary())"],"changes":{"status":"unchanged","added":[],"modified":[],"deleted":[]}},"app/face_recognizer.py":{"total":293,"lines":["\"\"\"","Face Recognition & Identity Matching Module (SFace).","","This module takes detected faces from a group photo, generates 128-dimensional","SFace biometric embeddings, compares them against reference employee profiles using","cosine similarity, and resolves identities.","","Features:","- Configurable cosine similarity threshold (default: 0.363 as recommended for SFace).","- Rejection of unknown faces below threshold (marks as 'Unknown').","- Duplicate prevention: Ensures each employee identity is matched at most once","  per group photo (the highest-confidence face receives the match).","\"\"\"","","from dataclasses import dataclass","import os","from pathlib import Path","from typing import Dict, List, Optional, Set, Tuple","import cv2","import numpy as np","","from app.employee_loader import EmployeeRecord","","","# Recommended cosine similarity threshold for SFace","# SFace cosine similarity ranges from -1.0 to +1.0.","# Benchmark threshold for SFace 1:1 verification is ~0.363.","# Higher threshold = stricter matching (fewer false positives).","# Lower threshold = more relaxed matching (higher recall).","DEFAULT_SFACE_THRESHOLD = 0.363","","","@dataclass","class MatchResult:","    \"\"\"Represents recognition result for a single face in a group photo.\"\"\"","    face_index: int","    bounding_box: Tuple[int, int, int, int]  # (x, y, w, h)","    landmarks: np.ndarray                   # 5 facial landmarks (5, 2)","    identity: str                           # Employee Name or \"Unknown\"","    similarity_score: float                 # Cosine similarity (-1.0 to 1.0)","    is_known: bool                          # True if matched to an employee, False if \"Unknown\"","    detection_score: float = 0.0            # YuNet face detection confidence","","    @property","    def display_label(self) -> str:","        \"\"\"Formatted label for bounding box overlays.\"\"\"","        if self.is_known:","            return f\"{self.identity} ({self.similarity_score * 100:.1f}%)\"","        return f\"Unknown ({self.similarity_score * 100:.1f}%)\"","","","class FaceRecognizer:","    \"\"\"","    Offline Face Recognizer using OpenCV's SFace model.","    Computes 128-D embeddings and performs cosine similarity matching.","    \"\"\"","","    def __init__(","        self,","        sface_model_path: Optional[str] = None,","        cosine_threshold: float = DEFAULT_SFACE_THRESHOLD,","    ):","        \"\"\"","        Initializes SFace recognizer.","","        Args:","            sface_model_path: Path to 'face_recognition_sface_2021dec.onnx'.","            cosine_threshold: Minimum cosine similarity to accept a match.","        \"\"\"","        project_root = Path(__file__).resolve().parent.parent","        self.sface_path = sface_model_path or str(project_root / \"models\" / \"face_recognition_sface_2021dec.onnx\")","","        if not os.path.exists(self.sface_path):","            raise FileNotFoundError(f\"SFace model file not found at: {self.sface_path}\")","","        self.cosine_threshold = float(cosine_threshold)","","        # Initialize native OpenCV FaceRecognizerSF","        self.recognizer = cv2.FaceRecognizerSF.create(","            model=self.sface_path,","            config=\"\",","        )","","    def set_threshold(self, threshold: float) -> None:","        \"\"\"Dynamically adjusts the matching threshold (e.g. from a UI slider).\"\"\"","        self.cosine_threshold = float(threshold)","","    def extract_embedding(self, image: np.ndarray, face_info: np.ndarray) -> np.ndarray:","        \"\"\"","        Aligns, crops, and extracts a normalized 128-D embedding for a single face.","","        Args:","            image: Full BGR input image.","            face_info: Detection output from YuNet containing bounding box and landmarks.","                       Shape: (14,) -> [x, y, w, h, x_re, y_re, x_le, y_le, x_nt, y_nt, x_rc, y_rc, x_lc, y_lc]","","        Returns:","            L2-normalized 128-dimensional embedding vector (shape: (128,)).","        \"\"\"","        # Geometrically align and crop the face using YuNet 5 facial landmarks","        aligned_face = self.recognizer.alignCrop(image, face_info)","","        # Extract 128-dimensional feature embedding","        feature = self.recognizer.feature(aligned_face)","","        # Flatten and normalize embedding to unit length (L2 norm = 1.0)","        embedding = feature.flatten()","        norm = np.linalg.norm(embedding)","        if norm > 0:","            embedding = embedding / norm","","        return embedding","","    @staticmethod","    def compute_cosine_similarity(embedding_a: np.ndarray, embedding_b: np.ndarray) -> float:","        \"\"\"","        Computes cosine similarity between two unit-normalized embeddings.","        Since vectors are L2-normalized: Cosine Similarity = dot_product(a, b).","        Output range is [-1.0, 1.0].","        \"\"\"","        return float(np.dot(embedding_a, embedding_b))","","    def match_face_to_references(","        self,","        query_embedding: np.ndarray,","        reference_records: List[EmployeeRecord],","        excluded_names: Optional[Set[str]] = None,","    ) -> Tuple[str, float, bool]:","        \"\"\"","        Finds the closest matching employee for a single face embedding.","","        Args:","            query_embedding: 128-D embedding of the face to identify.","            reference_records: List of registered EmployeeRecord objects.","            excluded_names: Optional set of names to exclude (e.g. if already assigned).","","        Returns:","            (identity_name, best_similarity_score, is_match)","        \"\"\"","        if not reference_records:","            return \"Unknown\", 0.0, False","","        excluded = excluded_names or set()","        best_name = \"Unknown\"","        best_score = -1.0","","        for record in reference_records:","            if record.name in excluded:","                continue","","            similarity = self.compute_cosine_similarity(query_embedding, record.embedding)","            if similarity > best_score:","                best_score = similarity","                best_name = record.name","","        # Enforce threshold check:","        # If best similarity is below threshold, reject match and return \"Unknown\"","        is_known = (best_score >= self.cosine_threshold)","        final_identity = best_name if is_known else \"Unknown\"","","        return final_identity, max(0.0, best_score), is_known","","    def recognize_group_faces(","        self,","        group_image: np.ndarray,","        detected_faces: Optional[np.ndarray],","        reference_records: List[EmployeeRecord],","        prevent_duplicates: bool = True,","    ) -> List[MatchResult]:","        \"\"\"","        Performs end-to-end recognition on all detected faces in a group photo.","","        Args:","            group_image: BGR group photograph.","            detected_faces: NumPy array of detected faces from YuNet (N, 15).","            reference_records: List of registered EmployeeRecord profiles.","            prevent_duplicates: If True, ensures no single employee identity is assigned","                                more than once in the same group photograph.","","        Returns:","            List of MatchResult objects, one for each detected face.","        \"\"\"","        if detected_faces is None or len(detected_faces) == 0:","            return []","","        num_faces = len(detected_faces)","        num_refs = len(reference_records)","","        # 1. Extract embeddings for all detected faces in the group photo","        group_embeddings: List[np.ndarray] = []","        for face_info in detected_faces:","            emb = self.extract_embedding(group_image, face_info)","            group_embeddings.append(emb)","","        # If no reference records are loaded, all faces are Unknown","        if num_refs == 0:","            results = []","            for idx, face_info in enumerate(detected_faces):","                box = (int(face_info[0]), int(face_info[1]), int(face_info[2]), int(face_info[3]))","                landmarks = face_info[4:14].reshape((5, 2))","                det_score = float(face_info[14]) if len(face_info) > 14 else 1.0","                results.append(","                    MatchResult(","                        face_index=idx,","                        bounding_box=box,","                        landmarks=landmarks,","                        identity=\"Unknown\",","                        similarity_score=0.0,","                        is_known=False,","                        detection_score=det_score,","                    )","                )","            return results","","        # 2. Build pairwise similarity matrix: shape (num_faces, num_refs)","        # We stack reference embeddings into a matrix (num_refs, 128)","        ref_matrix = np.vstack([rec.embedding for rec in reference_records])  # (M, 128)","        query_matrix = np.vstack(group_embeddings)                            # (N, 128)","","        # Matrix multiplication computes all pairwise cosine similarities in one vectorized step:","        # sim_matrix[i, j] = cosine similarity between group face i and employee j","        sim_matrix = np.matmul(query_matrix, ref_matrix.T)                    # (N, M)","","        # 3. Resolve identities","        assigned_results: Dict[int, Tuple[str, float, bool]] = {}","","        if prevent_duplicates:","            # Greedy Global Best-Match Assignment:","            # Collect all candidate (score, face_idx, ref_idx) pairs and sort descending.","            # Greedily accept the highest score, claiming both that face and that employee identity.","            candidate_pairs = []","            for face_idx in range(num_faces):","                for ref_idx in range(num_refs):","                    score = float(sim_matrix[face_idx, ref_idx])","                    candidate_pairs.append((score, face_idx, ref_idx))","","            # Sort candidate matches by highest similarity first","            candidate_pairs.sort(key=lambda item: item[0], reverse=True)","","            claimed_faces: Set[int] = set()","            claimed_employees: Set[str] = set()","","            for score, face_idx, ref_idx in candidate_pairs:","                emp_name = reference_records[ref_idx].name","","                if face_idx in claimed_faces:","                    continue","                if emp_name in claimed_employees:","                    continue","","                if score >= self.cosine_threshold:","                    assigned_results[face_idx] = (emp_name, score, True)","                    claimed_faces.add(face_idx)","                    claimed_employees.add(emp_name)","","            # Any face that didn't get a valid match above threshold is Unknown","            for face_idx in range(num_faces):","                if face_idx not in claimed_faces:","                    best_raw_score = float(np.max(sim_matrix[face_idx]))","                    assigned_results[face_idx] = (\"Unknown\", max(0.0, best_raw_score), False)","","        else:","            # Independent matching per face (duplicates allowed)","            for face_idx in range(num_faces):","                best_ref_idx = int(np.argmax(sim_matrix[face_idx]))","                best_score = float(sim_matrix[face_idx, best_ref_idx])","                if best_score >= self.cosine_threshold:","                    assigned_results[face_idx] = (reference_records[best_ref_idx].name, best_score, True)","                else:","                    assigned_results[face_idx] = (\"Unknown\", max(0.0, best_score), False)","","        # 4. Assemble final MatchResult list","        final_results: List[MatchResult] = []","        for face_idx, face_info in enumerate(detected_faces):","            box = (int(face_info[0]), int(face_info[1]), int(face_info[2]), int(face_info[3]))","            landmarks = face_info[4:14].reshape((5, 2))","            det_score = float(face_info[14]) if len(face_info) > 14 else 1.0","","            identity, sim_score, is_known = assigned_results[face_idx]","","            final_results.append(","                MatchResult(","                    face_index=face_idx,","                    bounding_box=box,","                    landmarks=landmarks,","                    identity=identity,","                    similarity_score=sim_score,","                    is_known=is_known,","                    detection_score=det_score,","                )","            )","","        return final_results"],"changes":{"status":"unchanged","added":[],"modified":[],"deleted":[]}},"app/image_processor.py":{"total":243,"lines":["\"\"\"","Group Photograph Processing & Annotation Pipeline.","","This module unifies YuNet face detection, employee reference indexing, and","SFace recognition to process a group photograph end-to-end.","","Responsibilities:","1. Detect all faces in a group photograph using YuNet.","2. Extract SFace embeddings and match each face against the reference database.","3. Mark matched individuals with their name and matching percentage.","4. Mark unrecognized individuals as 'Unknown'.","5. Render clean, auto-scaling visual bounding boxes and text headers over the image.","6. Return both the annotated BGR image and a structured list of MatchResult objects.","\"\"\"","","from dataclasses import dataclass","import os","from pathlib import Path","from typing import List, Optional, Tuple, Union","import cv2","import numpy as np","","from app.employee_loader import EmployeeLoader, EmployeeRecord","from app.face_recognizer import FaceRecognizer, MatchResult, DEFAULT_SFACE_THRESHOLD","","","# Visual Theme Colors (BGR format for OpenCV)","COLOR_KNOWN = (46, 204, 113)    # Emerald Green for identified employees","COLOR_UNKNOWN = (30, 144, 255)  # Amber / Orange for unlisted individuals","COLOR_TEXT = (255, 255, 255)    # White text for high contrast labels","","","class GroupImageProcessor:","    \"\"\"","    Combines YuNet face detector and SFace recognizer into a cohesive","    group photo analysis pipeline.","    \"\"\"","","    def __init__(","        self,","        yunet_model_path: Optional[str] = None,","        sface_model_path: Optional[str] = None,","        detection_threshold: float = 0.6,","        recognition_threshold: float = DEFAULT_SFACE_THRESHOLD,","    ):","        \"\"\"","        Initializes the processor and loads offline models.","","        Args:","            yunet_model_path: Path to YuNet ONNX model.","            sface_model_path: Path to SFace ONNX model.","            detection_threshold: Minimum confidence score for YuNet to detect a face.","            recognition_threshold: Minimum cosine similarity for SFace to match a known employee.","        \"\"\"","        project_root = Path(__file__).resolve().parent.parent","        self.yunet_path = yunet_model_path or str(project_root / \"models\" / \"face_detection_yunet_2023mar.onnx\")","        self.sface_path = sface_model_path or str(project_root / \"models\" / \"face_recognition_sface_2021dec.onnx\")","","        if not os.path.exists(self.yunet_path):","            raise FileNotFoundError(f\"YuNet model not found at: {self.yunet_path}\")","        if not os.path.exists(self.sface_path):","            raise FileNotFoundError(f\"SFace model not found at: {self.sface_path}\")","","        self.detection_threshold = float(detection_threshold)","        self.recognition_threshold = float(recognition_threshold)","","        # Initialize YuNet detector","        self.detector = cv2.FaceDetectorYN.create(","            model=self.yunet_path,","            config=\"\",","            input_size=(320, 320),","            score_threshold=self.detection_threshold,","            nms_threshold=0.3,","            top_k=5000,","        )","","        # Initialize SFace recognizer","        self.recognizer = FaceRecognizer(","            sface_model_path=self.sface_path,","            cosine_threshold=self.recognition_threshold,","        )","","    def set_recognition_threshold(self, threshold: float) -> None:","        \"\"\"Dynamically adjusts the face recognition similarity threshold.\"\"\"","        self.recognition_threshold = float(threshold)","        self.recognizer.set_threshold(self.recognition_threshold)","","    def set_detection_threshold(self, threshold: float) -> None:","        \"\"\"Dynamically adjusts the face detection confidence threshold.\"\"\"","        self.detection_threshold = float(threshold)","        self.detector.setScoreThreshold(self.detection_threshold)","","    @staticmethod","    def _read_image(image_input: Union[str, Path, np.ndarray]) -> Optional[np.ndarray]:","        \"\"\"Loads image safely across operating systems and Unicode paths.\"\"\"","        if isinstance(image_input, np.ndarray):","            return image_input.copy()","","        file_path = str(image_input)","        try:","            with open(file_path, \"rb\") as f:","                bytes_array = bytearray(f.read())","            np_arr = np.asarray(bytes_array, dtype=np.uint8)","            img = cv2.imdecode(np_arr, cv2.IMREAD_COLOR)","            return img","        except Exception:","            return None","","    @staticmethod","    def draw_annotations(","        image: np.ndarray,","        results: List[MatchResult],","        draw_landmarks: bool = False,","    ) -> np.ndarray:","        \"\"\"","        Renders styled bounding boxes and text labels on the image.","        Dynamically adapts line thickness and font scale according to image resolution.","        \"\"\"","        annotated = image.copy()","        h, w = annotated.shape[:2]","","        # Calculate responsive scale based on image dimensions","        diagonal = np.sqrt(h**2 + w**2)","        base_scale = max(0.45, diagonal / 1800.0)","        thickness = max(1, int(round(diagonal / 700.0)))","        font_scale = max(0.4, base_scale * 0.7)","        font = cv2.FONT_HERSHEY_SIMPLEX","","        for res in results:","            x, y, bw, bh = res.bounding_box","","            # Clamp coordinates to image boundaries","            x = max(0, min(x, w - 1))","            y = max(0, min(y, h - 1))","            bw = max(1, min(bw, w - x))","            bh = max(1, min(bh, h - y))","","            color = COLOR_KNOWN if res.is_known else COLOR_UNKNOWN","","            # 1. Draw outer face bounding box","            cv2.rectangle(annotated, (x, y), (x + bw, y + bh), color, thickness)","","            # 2. Draw facial landmarks (optional)","            if draw_landmarks and res.landmarks is not None:","                for pt in res.landmarks:","                    px, py = int(pt[0]), int(pt[1])","                    if 0 \u003c= px \u003c w and 0 \u003c= py \u003c h:","                        cv2.circle(annotated, (px, py), max(2, thickness), (0, 255, 255), -1)","","            # 3. Prepare label text","            label_text = res.display_label","            (text_w, text_h), baseline = cv2.getTextSize(label_text, font, font_scale, thickness)","","            # Determine label placement (prefer above bounding box; flip below if at top edge)","            padding = 4","            header_h = text_h + baseline + (padding * 2)","            header_w = text_w + (padding * 2)","","            if y - header_h >= 0:","                header_y1 = y - header_h","                header_y2 = y","                text_baseline_y = y - baseline - padding","            else:","                header_y1 = y","                header_y2 = y + header_h","                text_baseline_y = y + text_h + padding","","            header_x1 = x","            header_x2 = min(w, x + header_w)","","            # Draw filled background header pill","            cv2.rectangle(","                annotated,","                (header_x1, header_y1),","                (header_x2, header_y2),","                color,","                -1,","            )","","            # Draw text inside header","            cv2.putText(","                annotated,","                label_text,","                (header_x1 + padding, text_baseline_y),","                font,","                font_scale,","                COLOR_TEXT,","                max(1, thickness - 1),","                lineType=cv2.LINE_AA,","            )","","        return annotated","","    def process_group_photo(","        self,","        group_image_input: Union[str, Path, np.ndarray],","        reference_records: List[EmployeeRecord],","        prevent_duplicates: bool = True,","    ) -> Tuple[Optional[np.ndarray], List[MatchResult]]:","        \"\"\"","        Executes complete group photo detection, recognition, and annotation pipeline.","","        Args:","            group_image_input: File path or NumPy image array of the group photo.","            reference_records: In-memory list of validated employee profiles from EmployeeLoader.","            prevent_duplicates: Ensures each employee is assigned at most once per photo.","","        Returns:","            Tuple of:","            - annotated_image (np.ndarray): Group image with bounding boxes & labels rendered.","            - results (List[MatchResult]): Structured list of detected faces and their identities.","        \"\"\"","        image = self._read_image(group_image_input)","        if image is None or image.size == 0:","            return None, []","","        h, w = image.shape[:2]","        if h \u003c 20 or w \u003c 20:","            return image.copy(), []","","        # 1. Configure dynamic input size for YuNet detector","        self.detector.setInputSize((w, h))","","        # 2. Detect all faces in the group photo","        _, detected_faces = self.detector.detect(image)","","        # 3. Handle zero faces detected","        if detected_faces is None or len(detected_faces) == 0:","            # Return unannotated copy of the original image with empty results list","            return image.copy(), []","","        # 4. Perform SFace recognition and identity resolution for each face separately","        recognition_results = self.recognizer.recognize_group_faces(","            group_image=image,","            detected_faces=detected_faces,","            reference_records=reference_records,","            prevent_duplicates=prevent_duplicates,","        )","","        # 5. Render bounding boxes and identity headers","        annotated_image = self.draw_annotations(image, recognition_results)","","        return annotated_image, recognition_results"],"changes":{"status":"unchanged","added":[],"modified":[],"deleted":[]}},"app/ui_main_window.py":{"total":991,"lines":["\"\"\"","User Interface Module for 'Who Is in the Photo?'","Built with PySide6.","","Features:","- Clean, modern desktop layout with dark-slate theme and intuitive workflow.","- Responsive image viewer maintaining aspect ratio on resize.","- Background QThread processing to prevent UI freezing during model inference.","- Results sidebar with summary statistics and per-person identification cards.","- Configurable similarity threshold slider.","- High-resolution annotated image export.","\"\"\"","","import os","from pathlib import Path","from typing import List, Optional","import cv2","import numpy as np","","from PySide6.QtCore import Qt, QThread, Signal, Slot","from PySide6.QtGui import QAction, QFont, QIcon, QImage, QPixmap","from PySide6.QtWidgets import (","    QApplication,","    QFileDialog,","    QFrame,","    QHBoxLayout,","    QLabel,","    QMainWindow,","    QMessageBox,","    QProgressBar,","    QPushButton,","    QScrollArea,","    QSizePolicy,","    QSlider,","    QSplitter,","    QVBoxLayout,","    QWidget,",")","","from app.employee_loader import EmployeeLoader, EmployeeRecord, LoaderReport","from app.face_recognizer import DEFAULT_SFACE_THRESHOLD, MatchResult","from app.image_processor import GroupImageProcessor","","","# ----------------------------------------------------------------------","# Background Workers (QThread) to ensure responsive UI","# ----------------------------------------------------------------------","","class EmployeeLoadingWorker(QThread):","    \"\"\"Background worker for scanning and embedding employee reference photos.\"\"\"","    progress = Signal(int, int, str)","    finished = Signal(object)  # LoaderReport","    error = Signal(str)","","    def __init__(self, folder_path: str, loader: EmployeeLoader):","        super().__init__()","        self.folder_path = folder_path","        self.loader = loader","","    def run(self):","        try:","            report = self.loader.load_from_folder(","                self.folder_path,","                progress_callback=lambda cur, tot, name: self.progress.emit(cur, tot, name)","            )","            self.finished.emit(report)","        except Exception as e:","            self.error.emit(str(e))","","","class RecognitionWorker(QThread):","    \"\"\"Background worker for group face detection and matching.\"\"\"","    finished = Signal(object, list)  # (annotated_np_array, List[MatchResult])","    error = Signal(str)","","    def __init__(","        self,","        processor: GroupImageProcessor,","        group_image: np.ndarray,","        reference_records: List[EmployeeRecord],","    ):","        super().__init__()","        self.processor = processor","        self.group_image = group_image","        self.reference_records = reference_records","","    def run(self):","        try:","            annotated_img, results = self.processor.process_group_photo(","                group_image_input=self.group_image,","                reference_records=self.reference_records,","                prevent_duplicates=True,","            )","            self.finished.emit(annotated_img, results)","        except Exception as e:","            self.error.emit(str(e))","","","# ----------------------------------------------------------------------","# Resizable Image Viewer Widget","# ----------------------------------------------------------------------","","class ScaledImageViewer(QLabel):","    \"\"\"Custom QLabel that scales its displayed pixmap preserving aspect ratio.\"\"\"","","    def __init__(self, parent=None):","        super().__init__(parent)","        self.setAlignment(Qt.AlignCenter)","        self.setSizePolicy(QSizePolicy.Expanding, QSizePolicy.Expanding)","        self.setMinimumSize(400, 350)","        self._pixmap: Optional[QPixmap] = None","","    def set_image_pixmap(self, pixmap: Optional[QPixmap]):","        self._pixmap = pixmap","        self.update_display()","","    def update_display(self):","        if self._pixmap and not self._pixmap.isNull():","            scaled = self._pixmap.scaled(","                self.size(),","                Qt.KeepAspectRatio,","                Qt.SmoothTransformation,","            )","            super().setPixmap(scaled)","        else:","            super().clear()","","    def resizeEvent(self, event):","        super().resizeEvent(event)","        self.update_display()","","","# ----------------------------------------------------------------------","# Main Application Window","# ----------------------------------------------------------------------","","class MainWindow(QMainWindow):","    \"\"\"Main Application Window for 'Who Is in the Photo?'.\"\"\"","","    def __init__(self):","        super().__init__()","        self.setWindowTitle(\"Who Is in the Photo? - Offline Face Recognition\")","        self.resize(1280, 820)","        self.setMinimumSize(960, 640)","","        # Core Pipeline Engines","        self.loader = EmployeeLoader()","        self.processor = GroupImageProcessor(recognition_threshold=DEFAULT_SFACE_THRESHOLD)","","        # State Variables","        self.reference_records: List[EmployeeRecord] = []","        self.current_group_bgr: Optional[np.ndarray] = None","        self.current_annotated_bgr: Optional[np.ndarray] = None","        self.current_results: List[MatchResult] = []","","        # Background Worker handles","        self.load_worker: Optional[EmployeeLoadingWorker] = None","        self.recog_worker: Optional[RecognitionWorker] = None","","        # Build UI & Styles","        self._apply_stylesheet()","        self._init_ui()","","    # ------------------------------------------------------------------","    # UI Setup","    # ------------------------------------------------------------------","","    def _init_ui(self):","        central_widget = QWidget(self)","        self.setCentralWidget(central_widget)","","        root_layout = QVBoxLayout(central_widget)","        root_layout.setContentsMargins(18, 14, 18, 14)","        root_layout.setSpacing(12)","","        # 1. Header Bar","        header_layout = QHBoxLayout()","        title_box = QVBoxLayout()","        title_box.setSpacing(2)","","        app_title = QLabel(\"Who Is in the Photo?\")","        app_title.setObjectName(\"appTitle\")","        app_subtitle = QLabel(\"Offline Desktop Face Recognition & Attendance Analysis Platform\")","        app_subtitle.setObjectName(\"appSubtitle\")","","        title_box.addWidget(app_title)","        title_box.addWidget(app_subtitle)","        header_layout.addLayout(title_box)","        header_layout.addStretch()","","        root_layout.addLayout(header_layout)","","        # 2. Main Body Splitter (Controls / Photo Display / Results Sidebar)","        main_splitter = QSplitter(Qt.Horizontal)","        main_splitter.setHandleWidth(2)","","        # Left Control Panel","        control_panel = self._create_control_panel()","        main_splitter.addWidget(control_panel)","","        # Center Photo Viewer","        center_viewer_panel = self._create_photo_viewer_panel()","        main_splitter.addWidget(center_viewer_panel)","","        # Right Results Panel","        results_panel = self._create_results_panel()","        main_splitter.addWidget(results_panel)","","        main_splitter.setSizes([290, 650, 340])","        root_layout.addWidget(main_splitter, 1)","","        # 3. Bottom Status and Progress Bar","        status_bar_layout = QHBoxLayout()","        self.status_label = QLabel(\"Ready. Select employee folder to begin.\")","        self.status_label.setObjectName(\"statusLabel\")","","        self.progress_bar = QProgressBar()","        self.progress_bar.setVisible(False)","        self.progress_bar.setRange(0, 100)","        self.progress_bar.setFixedHeight(12)","","        status_bar_layout.addWidget(self.status_label, 1)","        status_bar_layout.addWidget(self.progress_bar, 0)","        root_layout.addLayout(status_bar_layout)","","    def _create_control_panel(self) -> QWidget:","        panel = QFrame()","        panel.setObjectName(\"controlPanel\")","        layout = QVBoxLayout(panel)","        layout.setContentsMargins(14, 14, 14, 14)","        layout.setSpacing(14)","","        panel_title = QLabel(\"WORKFLOW CONTROLS\")","        panel_title.setObjectName(\"sectionHeader\")","        layout.addWidget(panel_title)","","        # Step 1: Employee Database","        step1_box = QFrame()","        step1_box.setObjectName(\"stepBox\")","        s1_layout = QVBoxLayout(step1_box)","        s1_layout.setContentsMargins(10, 10, 10, 10)","        s1_layout.setSpacing(8)","","        s1_title = QLabel(\"1. Employee Database\")","        s1_title.setObjectName(\"stepTitle\")","        s1_layout.addWidget(s1_title)","","        self.btn_select_folder = QPushButton(\"📁 Select Employee Folder\")","        self.btn_select_folder.setObjectName(\"btnPrimary\")","        self.btn_select_folder.clicked.connect(self._on_select_folder_clicked)","        s1_layout.addWidget(self.btn_select_folder)","","        self.lbl_employee_status = QLabel(\"No employee folder selected.\")","        self.lbl_employee_status.setObjectName(\"lblSubtext\")","        self.lbl_employee_status.setWordWrap(True)","        s1_layout.addWidget(self.lbl_employee_status)","","        layout.addWidget(step1_box)","","        # Step 2: Group Photograph","        step2_box = QFrame()","        step2_box.setObjectName(\"stepBox\")","        s2_layout = QVBoxLayout(step2_box)","        s2_layout.setContentsMargins(10, 10, 10, 10)","        s2_layout.setSpacing(8)","","        s2_title = QLabel(\"2. Target Group Photo\")","        s2_title.setObjectName(\"stepTitle\")","        s2_layout.addWidget(s2_title)","","        self.btn_upload_group = QPushButton(\"🖼️ Upload Group Photo\")","        self.btn_upload_group.setObjectName(\"btnSecondary\")","        self.btn_upload_group.clicked.connect(self._on_upload_group_clicked)","        s2_layout.addWidget(self.btn_upload_group)","","        self.lbl_group_status = QLabel(\"No group photo uploaded.\")","        self.lbl_group_status.setObjectName(\"lblSubtext\")","        self.lbl_group_status.setWordWrap(True)","        s2_layout.addWidget(self.lbl_group_status)","","        layout.addWidget(step2_box)","","        # Step 3: Match Configuration & Execution","        step3_box = QFrame()","        step3_box.setObjectName(\"stepBox\")","        s3_layout = QVBoxLayout(step3_box)","        s3_layout.setContentsMargins(10, 10, 10, 10)","        s3_layout.setSpacing(8)","","        s3_title = QLabel(\"3. Identification & Tolerance\")","        s3_title.setObjectName(\"stepTitle\")","        s3_layout.addWidget(s3_title)","","        # Slider for threshold","        slider_label_box = QHBoxLayout()","        slider_title = QLabel(\"Similarity Threshold:\")","        slider_title.setObjectName(\"lblSubtext\")","        self.lbl_threshold_val = QLabel(f\"{DEFAULT_SFACE_THRESHOLD:.2f}\")","        self.lbl_threshold_val.setObjectName(\"lblThresholdValue\")","        slider_label_box.addWidget(slider_title)","        slider_label_box.addStretch()","        slider_label_box.addWidget(self.lbl_threshold_val)","        s3_layout.addLayout(slider_label_box)","","        self.slider_threshold = QSlider(Qt.Horizontal)","        self.slider_threshold.setRange(20, 70)  # 0.20 to 0.70","        self.slider_threshold.setValue(int(DEFAULT_SFACE_THRESHOLD * 100))","        self.slider_threshold.valueChanged.connect(self._on_threshold_changed)","        s3_layout.addWidget(self.slider_threshold)","","        self.btn_identify = QPushButton(\"🔍 Identify People\")","        self.btn_identify.setObjectName(\"btnIdentify\")","        self.btn_identify.setEnabled(False)","        self.btn_identify.clicked.connect(self._on_identify_clicked)","        s3_layout.addWidget(self.btn_identify)","","        layout.addWidget(step3_box)","","        # Step 4: Export Result","        step4_box = QFrame()","        step4_box.setObjectName(\"stepBox\")","        s4_layout = QVBoxLayout(step4_box)","        s4_layout.setContentsMargins(10, 10, 10, 10)","        s4_layout.setSpacing(8)","","        s4_title = QLabel(\"4. Save Output\")","        s4_title.setObjectName(\"stepTitle\")","        s4_layout.addWidget(s4_title)","","        self.btn_save_image = QPushButton(\"💾 Save Annotated Photo\")","        self.btn_save_image.setObjectName(\"btnSecondary\")","        self.btn_save_image.setEnabled(False)","        self.btn_save_image.clicked.connect(self._on_save_image_clicked)","        s4_layout.addWidget(self.btn_save_image)","","        layout.addWidget(step4_box)","        layout.addStretch()","","        return panel","","    def _create_photo_viewer_panel(self) -> QWidget:","        panel = QFrame()","        panel.setObjectName(\"viewerPanel\")","        layout = QVBoxLayout(panel)","        layout.setContentsMargins(12, 12, 12, 12)","        layout.setSpacing(8)","","        top_row = QHBoxLayout()","        viewer_header = QLabel(\"PHOTOGRAPH VIEWER\")","        viewer_header.setObjectName(\"sectionHeader\")","        top_row.addWidget(viewer_header)","        top_row.addStretch()","","        self.lbl_photo_meta = QLabel(\"\")","        self.lbl_photo_meta.setObjectName(\"lblSubtext\")","        top_row.addWidget(self.lbl_photo_meta)","        layout.addLayout(top_row)","","        # Central Image View","        self.image_viewer = ScaledImageViewer()","        self.image_viewer.setText(","            \"No Photograph Loaded\\n\\n\"","            \"1. Select an employee reference folder\\n\"","            \"2. Upload a group photograph\\n\"","            \"3. Click 'Identify People'\"","        )","        self.image_viewer.setStyleSheet(\"color: #71717a; font-size: 14px; font-weight: 500;\")","","        scroll_area = QScrollArea()","        scroll_area.setWidget(self.image_viewer)","        scroll_area.setWidgetResizable(True)","        scroll_area.setObjectName(\"photoScrollArea\")","        layout.addWidget(scroll_area, 1)","","        return panel","","    def _create_results_panel(self) -> QWidget:","        panel = QFrame()","        panel.setObjectName(\"resultsPanel\")","        layout = QVBoxLayout(panel)","        layout.setContentsMargins(14, 14, 14, 14)","        layout.setSpacing(10)","","        results_header = QLabel(\"IDENTIFICATION RESULTS\")","        results_header.setObjectName(\"sectionHeader\")","        layout.addWidget(results_header)","","        # Stats Cards Layout","        stats_box = QFrame()","        stats_box.setObjectName(\"statsBox\")","        sb_layout = QHBoxLayout(stats_box)","        sb_layout.setContentsMargins(6, 8, 6, 8)","","        self.stat_total = self._create_stat_badge(\"Faces\", \"0\", \"#60a5fa\")","        self.stat_known = self._create_stat_badge(\"Identified\", \"0\", \"#34d399\")","        self.stat_unknown = self._create_stat_badge(\"Unknown\", \"0\", \"#fbbf24\")","","        sb_layout.addWidget(self.stat_total)","        sb_layout.addWidget(self.stat_known)","        sb_layout.addWidget(self.stat_unknown)","        layout.addWidget(stats_box)","","        # Scrollable list for individual face result cards","        self.results_scroll = QScrollArea()","        self.results_scroll.setObjectName(\"resultsScroll\")","        self.results_scroll.setWidgetResizable(True)","","        self.results_container = QWidget()","        self.results_layout = QVBoxLayout(self.results_container)","        self.results_layout.setContentsMargins(0, 0, 0, 0)","        self.results_layout.setSpacing(8)","        self.results_layout.addStretch()","","        self.results_scroll.setWidget(self.results_container)","        layout.addWidget(self.results_scroll, 1)","","        # Initial Empty State Label","        self.empty_results_label = QLabel(\"Run 'Identify People' to see detected individual profiles and confidence scores.\")","        self.empty_results_label.setObjectName(\"lblSubtext\")","        self.empty_results_label.setWordWrap(True)","        self.results_layout.insertWidget(0, self.empty_results_label)","","        return panel","","    def _create_stat_badge(self, label: str, value: str, color: str) -> QWidget:","        badge = QFrame()","        badge.setObjectName(\"statBadge\")","        b_layout = QVBoxLayout(badge)","        b_layout.setContentsMargins(4, 4, 4, 4)","        b_layout.setSpacing(2)","","        val_lbl = QLabel(value)","        val_lbl.setObjectName(\"statVal\")","        val_lbl.setAlignment(Qt.AlignCenter)","        val_lbl.setStyleSheet(f\"color: {color}; font-size: 18px; font-weight: bold;\")","","        name_lbl = QLabel(label)","        name_lbl.setObjectName(\"lblSubtext\")","        name_lbl.setAlignment(Qt.AlignCenter)","","        b_layout.addWidget(val_lbl)","        b_layout.addWidget(name_lbl)","        badge.val_lbl = val_lbl  # store reference to update later","        return badge","","    # ------------------------------------------------------------------","    # Event Handlers & Business Logic","    # ------------------------------------------------------------------","","    @Slot()","    def _on_select_folder_clicked(self):","        folder = QFileDialog.getExistingDirectory(","            self,","            \"Select Employee Reference Photos Folder\",","            os.getcwd(),","        )","        if not folder:","            return","","        self.btn_select_folder.setEnabled(False)","        self.progress_bar.setVisible(True)","        self.progress_bar.setValue(0)","        self.status_label.setText(f\"Scanning directory: {Path(folder).name}...\")","","        # Run loading in background QThread","        self.load_worker = EmployeeLoadingWorker(folder, self.loader)","        self.load_worker.progress.connect(self._on_load_progress)","        self.load_worker.finished.connect(self._on_load_finished)","        self.load_worker.error.connect(self._on_load_error)","        self.load_worker.start()","","    @Slot(int, int, str)","    def _on_load_progress(self, current: int, total: int, filename: str):","        pct = int((current / max(1, total)) * 100)","        self.progress_bar.setValue(pct)","        self.status_label.setText(f\"Indexing employee photos: [{current}/{total}] {filename}\")","","    @Slot(object)","    def _on_load_finished(self, report: LoaderReport):","        self.btn_select_folder.setEnabled(True)","        self.progress_bar.setVisible(False)","        self.reference_records = report.valid_records","","        if report.total_images_found == 0:","            self.lbl_employee_status.setText(\"⚠️ No image files (.jpg, .jpeg, .png) found.\")","            self.status_label.setText(\"Warning: Selected folder contains no supported photos.\")","            QMessageBox.warning(","                self,","                \"No Photos Found\",","                \"No supported image files (.jpg, .jpeg, .png) were found in the selected folder.\\n\\n\"","                \"Please choose a directory containing employee portraits.\"","            )","            self._update_identify_button_state()","            return","","        if report.valid_count == 0:","            self.lbl_employee_status.setText(\"⚠️ 0 valid portraits indexed (all images skipped).\")","            self.status_label.setText(\"Warning: No valid employee profiles could be indexed.\")","            QMessageBox.warning(","                self,","                \"No Valid Profiles\",","                f\"Found {report.total_images_found} images, but none had exactly 1 clear face.\\n\\n\"","                f\"• {len(report.skipped_no_face)} had no face detected\\n\"","                f\"• {len(report.skipped_multi_face)} had multiple faces\\n\"","                f\"• {len(report.skipped_invalid_file)} were corrupt/unreadable\"","            )","            self._update_identify_button_state()","            return","","        self.lbl_employee_status.setText(","            f\"✅ {report.valid_count} employee profiles indexed.\"","        )","","        if report.has_warnings:","            warn_msg = (","                f\"Loaded {report.valid_count} valid portraits out of {report.total_images_found} images.\\n\\n\"","                f\"• {len(report.skipped_no_face)} skipped (no face detected)\\n\"","                f\"• {len(report.skipped_multi_face)} skipped (multiple faces)\\n\"","                f\"• {len(report.skipped_invalid_file)} skipped (unreadable/corrupt)\"","            )","            QMessageBox.information(self, \"Employee Loading Summary\", warn_msg)","","        self.status_label.setText(f\"Ready: {report.valid_count} employee reference profiles loaded.\")","        self._update_identify_button_state()","","    @Slot(str)","    def _on_load_error(self, err_msg: str):","        self.btn_select_folder.setEnabled(True)","        self.progress_bar.setVisible(False)","        QMessageBox.critical(self, \"Loading Error\", f\"Failed to load folder:\\n{err_msg}\")","        self.status_label.setText(\"Error loading employee folder.\")","","    @Slot()","    def _on_upload_group_clicked(self):","        file_path, _ = QFileDialog.getOpenFileName(","            self,","            \"Select Group Photograph\",","            os.getcwd(),","            \"Image Files (*.jpg *.jpeg *.png *.bmp)\",","        )","        if not file_path:","            return","","        # Load image via OpenCV","        img = self.loader.read_image_unicode(file_path)","        if img is None:","            QMessageBox.warning(","                self,","                \"Invalid Image\",","                f\"Could not decode the selected image file:\\n{file_path}\\n\\nThe file may be corrupted or in an unsupported format.\"","            )","            return","","        h, w = img.shape[:2]","        if h \u003c 20 or w \u003c 20:","            QMessageBox.warning(","                self,","                \"Image Too Small\",","                f\"The selected image dimensions ({w}×{h} px) are too small to reliably detect faces.\"","            )","            return","","        self.current_group_bgr = img","        self.current_annotated_bgr = None","        self.current_results = []","","        self.lbl_group_status.setText(f\"✅ {Path(file_path).name} ({w}×{h})\")","        self.lbl_photo_meta.setText(f\"{w}×{h} px\")","","        # Display raw group photo","        pixmap = self._cv2_to_qpixmap(img)","        self.image_viewer.set_image_pixmap(pixmap)","","        self.btn_save_image.setEnabled(False)","        self._clear_results_panel()","        self.status_label.setText(\"Group photo loaded. Click 'Identify People' to process.\")","        self._update_identify_button_state()","","    @Slot()","    def _on_threshold_changed(self, val: int):","        float_val = val / 100.0","        self.lbl_threshold_val.setText(f\"{float_val:.2f}\")","        self.processor.set_recognition_threshold(float_val)","","    def _update_identify_button_state(self):","        can_run = bool(self.reference_records and self.current_group_bgr is not None)","        self.btn_identify.setEnabled(can_run)","","    @Slot()","    def _on_identify_clicked(self):","        if not self.reference_records:","            QMessageBox.information(","                self,","                \"Employee Database Required\",","                \"Please select an employee folder containing reference portraits before identifying people.\"","            )","            return","","        if self.current_group_bgr is None:","            QMessageBox.information(","                self,","                \"Group Photograph Required\",","                \"Please upload a target group photograph first.\"","            )","            return","","        self.btn_identify.setEnabled(False)","        self.progress_bar.setVisible(True)","        self.progress_bar.setRange(0, 0)  # indeterminate spinner","        self.status_label.setText(\"Detecting and recognizing faces offline...\")","","        # Run recognition in background thread","        self.recog_worker = RecognitionWorker(","            self.processor,","            self.current_group_bgr,","            self.reference_records,","        )","        self.recog_worker.finished.connect(self._on_recognition_finished)","        self.recog_worker.error.connect(self._on_recognition_error)","        self.recog_worker.start()","","    @Slot(object, list)","    def _on_recognition_finished(self, annotated_bgr: np.ndarray, results: List[MatchResult]):","        self.btn_identify.setEnabled(True)","        self.progress_bar.setVisible(False)","        self.current_annotated_bgr = annotated_bgr","        self.current_results = results","","        # Update Viewer with annotated image","        pixmap = self._cv2_to_qpixmap(annotated_bgr)","        self.image_viewer.set_image_pixmap(pixmap)","","        # Enable export","        self.btn_save_image.setEnabled(True)","","        # Populate Results Sidebar","        self._populate_results_panel(results)","","        total = len(results)","        known = sum(1 for r in results if r.is_known)","        unknown = total - known","        self.status_label.setText(","            f\"Analysis complete: {total} faces detected ({known} identified, {unknown} unknown).\"","        )","","    @Slot(str)","    def _on_recognition_error(self, err_msg: str):","        self.btn_identify.setEnabled(True)","        self.progress_bar.setVisible(False)","        QMessageBox.critical(self, \"Recognition Error\", f\"Error during face recognition:\\n{err_msg}\")","        self.status_label.setText(\"Recognition error occurred.\")","","    @Slot()","    def _on_save_image_clicked(self):","        if self.current_annotated_bgr is None:","            return","","        save_path, _ = QFileDialog.getSaveFileName(","            self,","            \"Save Annotated Photograph\",","            \"annotated_group_photo.jpg\",","            \"JPEG Image (*.jpg);;PNG Image (*.png)\",","        )","        if not save_path:","            return","","        # Unicode safe save","        try:","            ext = Path(save_path).suffix or \".jpg\"","            success, encoded_img = cv2.imencode(ext, self.current_annotated_bgr)","            if success:","                with open(save_path, \"wb\") as f:","                    f.write(encoded_img.tobytes())","                QMessageBox.information(self, \"Saved\", f\"Annotated photograph saved successfully to:\\n{save_path}\")","            else:","                QMessageBox.critical(self, \"Save Error\", \"Could not encode image format.\")","        except Exception as e:","            QMessageBox.critical(self, \"Save Error\", f\"Failed to save image:\\n{str(e)}\")","","    # ------------------------------------------------------------------","    # Results Display Helpers","    # ------------------------------------------------------------------","","    def _clear_results_panel(self):","        # Remove all existing result cards","        while self.results_layout.count() > 1:","            item = self.results_layout.takeAt(0)","            if item.widget():","                item.widget().deleteLater()","        self.stat_total.val_lbl.setText(\"0\")","        self.stat_known.val_lbl.setText(\"0\")","        self.stat_unknown.val_lbl.setText(\"0\")","","    def _populate_results_panel(self, results: List[MatchResult]):","        self._clear_results_panel()","","        total = len(results)","        known = sum(1 for r in results if r.is_known)","        unknown = total - known","","        self.stat_total.val_lbl.setText(str(total))","        self.stat_known.val_lbl.setText(str(known))","        self.stat_unknown.val_lbl.setText(str(unknown))","","        if total == 0:","            no_faces_lbl = QLabel(\"No faces were detected in this photograph.\")","            no_faces_lbl.setObjectName(\"lblSubtext\")","            self.results_layout.insertWidget(0, no_faces_lbl)","            return","","        for res in results:","            card = QFrame()","            card.setObjectName(\"resultCard\")","            c_layout = QHBoxLayout(card)","            c_layout.setContentsMargins(10, 8, 10, 8)","            c_layout.setSpacing(10)","","            # Left Face Index Badge","            idx_badge = QLabel(f\"#{res.face_index + 1}\")","            idx_badge.setObjectName(\"faceIndexBadge\")","            c_layout.addWidget(idx_badge)","","            # Identity details","            details_box = QVBoxLayout()","            details_box.setSpacing(2)","","            name_lbl = QLabel(res.identity)","            name_lbl.setObjectName(\"resultNameKnown\" if res.is_known else \"resultNameUnknown\")","","            score_str = f\"Match: {res.similarity_score * 100:.1f}% | Detection: {res.detection_score * 100:.0f}%\"","            score_lbl = QLabel(score_str)","            score_lbl.setObjectName(\"lblSubtext\")","","            details_box.addWidget(name_lbl)","            details_box.addWidget(score_lbl)","            c_layout.addLayout(details_box, 1)","","            # Status Pill (Identified / Unknown)","            pill = QLabel(\"IDENTIFIED\" if res.is_known else \"UNKNOWN\")","            pill.setObjectName(\"statusPillKnown\" if res.is_known else \"statusPillUnknown\")","            c_layout.addWidget(pill)","","            self.results_layout.insertWidget(self.results_layout.count() - 1, card)","","    @staticmethod","    def _cv2_to_qpixmap(bgr_img: np.ndarray) -> QPixmap:","        \"\"\"Converts an OpenCV BGR numpy array to QPixmap for display.\"\"\"","        rgb_img = cv2.cvtColor(bgr_img, cv2.COLOR_BGR2RGB)","        h, w, ch = rgb_img.shape","        bytes_per_line = ch * w","        q_img = QImage(rgb_img.data, w, h, bytes_per_line, QImage.Format_RGB888)","        return QPixmap.fromImage(q_img)","","    def closeEvent(self, event):","        \"\"\"Safely terminates any background worker threads before window closes.\"\"\"","        if self.load_worker and self.load_worker.isRunning():","            self.load_worker.terminate()","            self.load_worker.wait(1000)","        if self.recog_worker and self.recog_worker.isRunning():","            self.recog_worker.terminate()","            self.recog_worker.wait(1000)","        super().closeEvent(event)","","    # ------------------------------------------------------------------","    # Modern Dark Theme Stylesheet","    # ------------------------------------------------------------------","","    def _apply_stylesheet(self):","        self.setStyleSheet(\"\"\"","            QWidget {","                background-color: #0f172a;","                color: #f8fafc;","                font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;","
